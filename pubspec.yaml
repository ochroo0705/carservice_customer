name: carservice_customer

description: "Customer-facing Carservice discovery and booking application."

publish_to: 'none' 

version: 1.0.2+4

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  dio: ^5.9.0
  flutter_secure_storage: ^11.2.0
  google_maps_flutter: ^2.18.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  uuid: ^4.6.0
  provider: ^6.1.5
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  firebase_crashlytics: ^5.3.0
  cached_network_image: ^4.0.0
  geolocator: ^14.0.2
  go_router: ^18.0.2
  pdf: ^3.13.0
  printing: ^5.15.0
  flutter_dotenv: ^6.0.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  drift_dev: ^2.34.6
  build_runner: ^2.16.1
  mocktail: 1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/mark-padded.png"
  min_sdk_android: 21
  background_color: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/mark-padded.png"
  remove_alpha_ios: true


# apply a shape mask.
flutter_native_splash:
  # carservice.mn --oc-carbon: #ECF0F1 (light) / #1E2B38 (dark)
  color: "#ECF0F1"
  image: assets/brand/logo-wordmark.png
  color_dark: "#1E2B38"
  image_dark: assets/brand/logo-wordmark-dark.png
  android_12:
    color: "#ECF0F1"
    image: assets/brand/splash-android12.png
    color_dark: "#1E2B38"
    image_dark: assets/brand/splash-android12.png
  android: true
  ios: true
flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/brand/
    - assets/maps/
